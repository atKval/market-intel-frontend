<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e1117;--sur:#161b26;--sur2:#1e2535;--brd:#2a3348;--txt:#e8eaf2;--txt2:#8892aa;--txt3:#4a5468;--grn:#26A69A;--gd:#0a2e25;--gt:#4dd9a8;--red:#EF5350;--rd:#2e0a10;--rt:#ff8090;--amb:#FF9800;--ad:#2a1800;--at:#ffc94d;--blu:#2962FF;--bld:#0a1a40;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:13px;min-height:100vh}
.topbar{background:var(--sur);border-bottom:1px solid var(--brd);padding:0 16px;height:48px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:14px;font-weight:500;color:var(--grn);margin-right:8px}
.fsel{font-size:12px;padding:5px 22px 5px 8px;border-radius:5px;border:1px solid var(--brd);background:var(--sur2);color:var(--txt);cursor:pointer;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='8' height='5' viewBox='0 0 8 5' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l3 3 3-3' stroke='%238892aa' stroke-width='1.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 7px center}
.fsel:hover{border-color:var(--grn)}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s ease-in-out infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ltxt{font-size:11px;color:var(--grn)}
.rbtn{font-size:12px;padding:5px 10px;border-radius:5px;border:1px solid var(--brd);background:none;color:var(--txt);cursor:pointer}
.rbtn:hover{background:var(--blu);border-color:var(--blu);color:#fff}
.tsl{font-size:11px;color:var(--txt3)}
.scr{display:none}.scr.on{display:block}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;border-bottom:1px solid var(--brd);background:var(--sur)}
.scard{padding:8px 12px;border-radius:6px;cursor:pointer;border:2px solid transparent;user-select:none}
.scard:hover{opacity:.85}.scard.sel{border-color:currentColor}
.sc-r{background:var(--gd);color:var(--gt)}.sc-s{background:var(--ad);color:var(--at)}.sc-a{background:var(--rd);color:var(--rt)}.sc-n{background:var(--sur2);color:var(--txt2)}
.slbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:2px}
.sval{font-size:22px;font-weight:500;font-family:monospace}
.twrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;min-width:700px}
th{padding:6px 8px;text-align:left;font-size:10px;font-weight:500;color:var(--txt3);border-bottom:1px solid var(--brd);background:var(--sur2);white-space:nowrap;user-select:none;cursor:pointer}
th:hover{color:var(--txt)}
td{padding:8px 8px;border-bottom:1px solid var(--brd);vertical-align:middle;cursor:pointer}
tr:hover td{background:var(--sur2)}
.sym{font-weight:500;font-family:monospace;font-size:12px}
.tbg{font-size:9px;padding:1px 5px;border-radius:99px;border:1px solid var(--brd);color:var(--txt3);margin-left:3px}
.up{color:var(--grn)}.dn{color:var(--red)}
.sbr{display:flex;align-items:center;gap:5px}
.sbt{flex:1;height:4px;background:var(--brd);border-radius:2px;overflow:hidden}
.sbf{height:4px;border-radius:2px}
.sbn{font-family:monospace;font-size:11px;min-width:28px;text-align:right;font-weight:500}
.vp{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500}
.vr{background:var(--gd);color:var(--gt)}.vs{background:var(--ad);color:var(--at)}.vn{background:var(--sur2);color:var(--txt2)}.va{background:var(--rd);color:var(--rt)}
.ent{font-size:10px;font-weight:500}
.eg{color:var(--grn)}.ew{color:var(--amb)}.ep2{color:var(--red)}
.rrv{font-family:monospace;font-size:11px}
.why{font-size:11px;color:var(--txt2);line-height:1.5;white-space:normal}
.ep{font-size:10px;padding:1px 6px;border-radius:99px}
.ep-ok{background:var(--gd);color:var(--gt)}.ep-warn{background:var(--ad);color:var(--at)}
.lmore{text-align:center;padding:12px;font-size:12px;color:var(--txt3);cursor:pointer;border-top:1px solid var(--brd)}
.lmore:hover{color:var(--txt);background:var(--sur2)}
.dtopbar{background:var(--sur);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bbtn{font-size:12px;padding:5px 10px;border-radius:5px;border:1px solid var(--brd);background:none;color:var(--txt);cursor:pointer}
.bbtn:hover{background:var(--sur2)}
.dsym{font-size:15px;font-weight:500;font-family:monospace}
.dname{font-size:12px;color:var(--txt2)}
.dprice{font-size:15px;font-weight:500;font-family:monospace}
.dgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);min-height:580px}
.cpan{border-right:1px solid var(--brd);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.irow{display:flex;gap:5px;flex-wrap:wrap}
.ibtn{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--brd);background:none;color:var(--txt3);cursor:pointer}
.ibtn.on{background:rgba(38,166,154,.15);color:var(--grn);border-color:rgba(38,166,154,.4)}
.cbox{background:var(--sur2);border-radius:5px;flex:1;min-height:200px;position:relative;overflow:hidden}
.cbox canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important}
.rsibox{background:var(--sur2);border-radius:5px;height:72px;position:relative;overflow:hidden}
.rsibox canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important}
.rpan{padding:12px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:640px}
.rpan::-webkit-scrollbar{width:3px}
.rpan::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
.rsec{background:var(--sur2);border-radius:6px;padding:10px 12px}
.stit{font-size:10px;font-weight:500;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.crow{margin-bottom:9px}
.chdr{display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:var(--txt);margin-bottom:3px}
.csc{font-family:monospace;color:var(--txt3)}
.cbt{height:3px;background:var(--brd);border-radius:2px;overflow:hidden;margin-bottom:3px}
.cbf{height:3px;border-radius:2px}
.csg{font-size:11px;line-height:1.6}
.sp{color:var(--grn)}.sn{color:var(--red)}.su{color:var(--txt3)}
.clc{background:var(--sur2);border-radius:6px;padding:10px 12px}
.ckr{font-size:11px;line-height:2;display:flex;align-items:center;gap:5px}
.ck1{color:var(--grn)}.ck2{color:var(--amb)}.ck3{color:var(--red)}
.esum{margin-top:6px;font-size:11px;font-weight:500;text-align:center;padding:4px 8px;border-radius:4px}
.rrc{background:var(--sur2);border-radius:6px;padding:10px 12px}
.rrg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.rri{background:var(--sur);border-radius:5px;padding:6px 8px;border:1px solid var(--brd)}
.rrl{font-size:10px;color:var(--txt3);margin-bottom:2px}
.rrv2{font-size:13px;font-weight:500;font-family:monospace}
.rrr{font-size:12px;font-weight:500;text-align:center}
.posc{background:var(--sur2);border-radius:6px;padding:10px 12px}
.posm{font-size:14px;font-weight:500;color:var(--txt);margin-bottom:3px}
.poss{font-size:11px;color:var(--txt3)}
.tabrow{display:flex;gap:4px;border-top:1px solid var(--brd);padding-top:10px}
.tbtn{flex:1;font-size:11px;padding:6px;border-radius:5px;border:1px solid var(--brd);background:none;color:var(--txt2);cursor:pointer}
.tbtn:hover,.tbtn.on{background:var(--bld);color:var(--txt);border-color:var(--blu)}
.tpane{display:none}.tpane.on{display:block}
.ni{padding:9px 0;border-bottom:1px solid var(--brd);cursor:pointer}
.ni:hover{opacity:.8}
.ntt{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:3px;color:var(--txt)}
.nm{font-size:10px;color:var(--txt3);display:flex;gap:6px;align-items:center}
.fr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--brd);font-size:11px}
.fk{color:var(--txt3)}.fv{font-family:monospace;color:var(--txt)}
.sr2{margin-bottom:11px}
.sl{font-size:11px;color:var(--txt3);margin-bottom:4px;display:block}
.sw{display:flex;align-items:center;gap:8px}
.sw input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--brd);border-radius:2px;outline:none;cursor:pointer}
.sw input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--blu);border-radius:50%}
.sv2{font-family:monospace;font-size:11px;min-width:36px;text-align:right;color:var(--txt)}
.apb{width:100%;padding:8px;background:var(--blu);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:12px;margin-top:8px}
.apb:hover{opacity:.85}
.empty{text-align:center;padding:40px;color:var(--txt3);font-size:13px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--brd);border-top-color:var(--grn);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">&#9650; Market Intel</span>
  <select class="fsel" id="fm" onchange="applyF()"><option value="">Market: All</option><option value="US">US</option><option value="Scandinavia">Scandinavia</option><option value="Europe">Europe</option></select>
  <select class="fsel" id="fc2" onchange="applyF()"><option value="">Country: All</option><option value="US">United States</option><option value="DK">Denmark</option><option value="SE">Sweden</option><option value="NO">Norway</option><option value="DE">Germany</option><option value="CA">Canada</option></select>
  <select class="fsel" id="ft" onchange="applyF()"><option value="">Tier: All stocks</option><option value="Penny">Penny (&lt;$5)</option><option value="Mid">Mid ($5-$100)</option><option value="Large">Large ($100+)</option></select>
  <select class="fsel" id="fs" onchange="applyF()"><option value="">Sector: All</option><option value="Tech">Technology</option><option value="Pharma">Pharma / Health</option><option value="Energy">Energy</option><option value="Finance">Finance</option><option value="Bev">Beverages / Food</option><option value="Ind">Industrial</option></select>
  <select class="fsel" id="fe" onchange="applyF()"><option value="">Entry: All</option><option value="GOOD">Good entry only</option><option value="FAIR">Fair or better</option></select>
  <select class="fsel" id="fso" onchange="applyF()"><option value="score">Sort: Score</option><option value="chg_up">Sort: Gainers</option><option value="chg_dn">Sort: Losers</option><option value="rr">Sort: R/R ratio</option></select>
  <div class="tr">
    <span class="ldot"></span><span class="ltxt" id="lstatus">Loading...</span>
    <button class="rbtn" onclick="refreshScan()">&#8635; Refresh</button>
    <span class="tsl" id="tscan"></span>
  </div>
</div>

<div class="scr on" id="s1">
  <div class="sumrow">
    <div class="scard sc-r" id="cr" onclick="fv2('recommend')"><div class="slbl">Recommend</div><div class="sval" id="nr">-</div></div>
    <div class="scard sc-s" id="cs2" onclick="fv2('speculative')"><div class="slbl">Speculative</div><div class="sval" id="ns">-</div></div>
    <div class="scard sc-a" id="ca" onclick="fv2('avoid')"><div class="slbl">Avoid</div><div class="sval" id="na2">-</div></div>
    <div class="scard sc-n" id="cn" onclick="fv2('neutral')"><div class="slbl">Neutral</div><div class="sval" id="nn">-</div></div>
  </div>
  <div class="twrap">
    <table>
      <thead><tr>
        <th style="width:88px">Symbol</th>
        <th style="width:150px">Name</th>
        <th style="width:78px">Price / Chg</th>
        <th style="width:100px">Score</th>
        <th style="width:78px">Entry</th>
        <th style="width:66px">R/R</th>
        <th style="width:58px">Sector</th>
        <th>Why now - 48h catalyst</th>
        <th style="width:24px"></th>
      </tr></thead>
      <tbody id="stb"><tr><td colspan="9" class="empty"><span class="spin"></span>Loading market data...</td></tr></tbody>
    </table>
  </div>
  <div class="lmore" id="lm" style="display:none" onclick="loadMore()">Show more stocks</div>
</div>

<div class="scr" id="s2">
  <div class="dtopbar">
    <button class="bbtn" onclick="goBack()">&#8592; Back</button>
    <span class="dsym" id="dsym">-</span>
    <span class="dname" id="dname">-</span>
    <span class="dprice" id="dprice">-</span>
    <span id="dchg" style="font-size:12px;margin-left:2px"></span>
    <span id="dvp" class="vp">-</span>
    <span id="dent" style="font-size:11px;font-weight:500;margin-left:4px"></span>
    <span id="drr" style="font-size:11px;color:var(--txt3);font-family:monospace;margin-left:4px"></span>
  </div>
  <div class="dgrid">
    <div class="cpan">
      <div class="irow">
        <button class="ibtn on" id="i-sma" onclick="tog('sma',this)">SMA</button>
        <button class="ibtn on" id="i-bb" onclick="tog('bb',this)">BB</button>
        <button class="ibtn on" id="i-sr" onclick="tog('sr',this)">S/R</button>
        <button class="ibtn on" id="i-fc" onclick="tog('fc',this)">Forecast</button>
        <button class="ibtn on" id="i-vol" onclick="tog('vol',this)">Volume</button>
        <button class="ibtn on" id="i-rsi" onclick="tog('rsi',this)">RSI</button>
      </div>
      <div class="cbox"><canvas id="pc"></canvas></div>
      <div class="rsibox" id="rb"><canvas id="rc"></canvas></div>
    </div>
    <div class="rpan" id="rp"><div class="empty">Loading...</div></div>
  </div>
</div>

<script>
const API = window.location.hostname === 'localhost'
  ? 'http://localhost:5000/api'
  : 'https://market-intel-backend-production.up.railway.app/api';
let all=[],filt=[],vf=null,inds={sma:true,bb:true,sr:true,fc:true,vol:true,rsi:true};
let pc=null,rc=null,cs=null,dc=20;

const CFG={rsi_oversold:30,rsi_overbought:70,profit_margin:20,revenue_growth:20,pe_undervalued:15,pe_overvalued:40,max_debt_equity:50,recommend_threshold:8,account_size:10000,risk_percent:2.0};

async function init(){
  try{
    document.getElementById('lstatus').textContent='Scanning...';
    const r=await fetch(API+'/scan');
    if(!r.ok)throw new Error('api');
    const j=await r.json();
    all=j.stocks||[];
    document.getElementById('tscan').textContent=fmtTs(j.timestamp);
    document.getElementById('lstatus').textContent='Live';
    applyF();
  }catch(e){
    document.getElementById('lstatus').textContent='Offline - demo data';
    loadDemo();
  }
}

async function refreshScan(){
  document.getElementById('lstatus').textContent='Refreshing...';
  try{await fetch(API+'/scan/refresh',{method:'POST'});await init();}
  catch(e){document.getElementById('lstatus').textContent='Error';}
}

function fmtTs(ts){
  if(!ts)return'';
  try{const d=new Date(ts);return d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'});}catch(e){return ts;}
}

function fp(p){
  if(p===null||p===undefined)return'-';
  if(p<0.01&&p>0)return'$'+p.toFixed(5);
  if(p<1)return'$'+p.toFixed(3);
  if(p<100)return'$'+p.toFixed(2);
  return'$'+Math.round(p).toLocaleString();
}

function applyF(){
  const m=document.getElementById('fm').value;
  const c=document.getElementById('fc2').value;
  const t=document.getElementById('ft').value;
  const s=document.getElementById('fs').value;
  const e=document.getElementById('fe').value;
  const so=document.getElementById('fso').value;
  const SC=['DK','SE','NO'],EU=['DK','SE','NO','DE'];
  filt=all.filter(x=>{
    if(m==='US'&&x.country!=='US')return false;
    if(m==='Scandinavia'&&!SC.includes(x.country))return false;
    if(m==='Europe'&&!EU.includes(x.country))return false;
    if(c&&x.country!==c)return false;
    if(t&&x.tier!==t)return false;
    if(s&&x.sector!==s)return false;
    if(e==='GOOD'&&x.entry!=='GOOD')return false;
    if(e==='FAIR'&&!['GOOD','FAIR'].includes(x.entry))return false;
    if(vf){const v=(x.verdict_class||'').toLowerCase();
      if(vf==='recommend'&&v!=='recommend')return false;
      if(vf==='speculative'&&!v.includes('speculative'))return false;
      if(vf==='avoid'&&!v.includes('avoid'))return false;
      if(vf==='neutral'&&v!=='neutral')return false;
    }
    return true;
  });
  if(so==='score')filt.sort((a,b)=>b.total-a.total);
  else if(so==='chg_up')filt.sort((a,b)=>b.chg-a.chg);
  else if(so==='chg_dn')filt.sort((a,b)=>a.chg-b.chg);
  else if(so==='rr')filt.sort((a,b)=>(b.rr_ratio||0)-(a.rr_ratio||0));
  updCards();dc=20;renderT();
}

function fv2(v){
  vf=vf===v?null:v;
  ['cr','cs2','ca','cn'].forEach(id=>document.getElementById(id).classList.remove('sel'));
  const map={recommend:'cr',speculative:'cs2',avoid:'ca',neutral:'cn'};
  if(vf&&map[vf])document.getElementById(map[vf]).classList.add('sel');
  applyF();
}

function updCards(){
  const cnt={recommend:0,speculative:0,avoid:0,neutral:0};
  all.forEach(s=>{
    const v=(s.verdict_class||'neutral').toLowerCase();
    if(v==='recommend')cnt.recommend++;
    else if(v.includes('speculative'))cnt.speculative++;
    else if(v.includes('avoid')&&!v.includes('spec'))cnt.avoid++;
    else cnt.neutral++;
  });
  document.getElementById('nr').textContent=cnt.recommend;
  document.getElementById('ns').textContent=cnt.speculative;
  document.getElementById('na2').textContent=cnt.avoid;
  document.getElementById('nn').textContent=cnt.neutral;
}

function loadMore(){dc+=20;renderT();}

function vcls(vc){const v=(vc||'').toLowerCase();if(v==='recommend')return'vr';if(v.includes('speculative'))return'vs';if(v.includes('avoid'))return'va';return'vn';}
function vlbl(vc){const v=(vc||'').toLowerCase();if(v==='recommend')return'Recommend';if(v.includes('speculative'))return'Speculative';if(v.includes('avoid'))return'Avoid';return'Neutral';}

function renderT(){
  const tb=document.getElementById('stb');
  const vis=filt.slice(0,dc);
  if(!vis.length){tb.innerHTML='<tr><td colspan="9" class="empty">No stocks match your filters</td></tr>';document.getElementById('lm').style.display='none';return;}
  const col=t=>t>=8?'var(--grn)':t>=0?'var(--amb)':'var(--red)';
  const pct=t=>Math.min(100,Math.max(0,(t+20)/70*100));
  const rrcol=r=>r>=3?'var(--grn)':r>=2?'var(--amb)':'var(--red)';
  tb.innerHTML=vis.map(s=>`<tr onclick="openD('${s.sym}')">
    <td><span class="sym" style="color:${col(s.total)}">${s.sym}</span><span class="tbg">${s.tier||''}</span></td>
    <td style="color:var(--txt2);font-size:11px;overflow:hidden;text-overflow:ellipsis">${s.name} <span style="color:var(--txt3)">${s.country}</span></td>
    <td style="text-align:right"><div style="font-family:monospace">${fp(s.price)}</div><div class="${s.chg>=0?'up':'dn'}" style="font-size:10px">${s.chg>=0?'+':''}${(s.chg||0).toFixed(2)}%</div></td>
    <td><div class="sbr"><div class="sbt"><div class="sbf" style="width:${pct(s.total)}%;background:${col(s.total)}"></div></div><span class="sbn" style="color:${col(s.total)}">${s.total>0?'+':''}${s.total}</span></div><span class="vp ${vcls(s.verdict_class)}">${vlbl(s.verdict_class)}</span></td>
    <td><div class="ent ${s.entry==='GOOD'?'eg':s.entry==='FAIR'||s.entry==='WAIT'?'ew':'ep2'}">${s.entry||'-'}</div><div style="font-size:10px;color:var(--txt3)">RSI ${s.rsi||'-'}</div></td>
    <td><span class="rrv" style="color:${rrcol(s.rr_ratio||0)}">${s.rr_ratio?'1:'+s.rr_ratio:'-'}</span></td>
    <td style="font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden">${s.sector||'-'}</td>
    <td><div class="why">${(s.why_now||[]).slice(0,2).join(' · ')||'-'}</div><div style="margin-top:2px"><span class="ep ep-ok">No events</span></div></td>
    <td style="font-size:14px;color:var(--txt3)">&#8250;</td>
  </tr>`).join('');
  const lm=document.getElementById('lm');
  if(filt.length>dc){lm.style.display='block';lm.textContent='Show more ('+(filt.length-dc)+' remaining)';}
  else lm.style.display='none';
}

function smaC(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n);}
function bbC(a,n=20,k=2){const m=smaC(a,n);return{mid:m,upper:m.map((mv,i)=>{if(!mv)return null;const w=a.slice(Math.max(0,i-n+1),i+1),sd=Math.sqrt(w.reduce((s,v)=>s+(v-mv)**2,0)/w.length);return mv+k*sd;}),lower:m.map((mv,i)=>{if(!mv)return null;const w=a.slice(Math.max(0,i-n+1),i+1),sd=Math.sqrt(w.reduce((s,v)=>s+(v-mv)**2,0)/w.length);return mv-k*sd;})};}
function rsiC(a,n=14){if(a.length<n+1)return Array(a.length).fill(null);const d=a.map((v,i)=>i===0?0:v-a[i-1]);let ag=d.slice(1,n+1).filter(v=>v>0).reduce((s,v)=>s+v,0)/n,al=d.slice(1,n+1).filter(v=>v<0).reduce((s,v)=>s+Math.abs(v),0)/n;const r=Array(n).fill(null);r.push(al===0?100:100-(100/(1+ag/al)));for(let i=n;i<d.length;i++){ag=(ag*(n-1)+(d[i]>0?d[i]:0))/n;al=(al*(n-1)+(d[i]<0?Math.abs(d[i]):0))/n;r.push(al===0?100:100-(100/(1+ag/al)));}return r;}
function fcC(prices,target,days=30){const last=prices[prices.length-1],vol=Math.sqrt(prices.slice(-15).reduce((s,v,i,a)=>i===0?0:s+(v/a[i-1]-1)**2,0)/14);const pts=[];for(let i=1;i<=days;i++){const base=last+(target-last)*(i/days)*0.4;pts.push({base,u68:base+last*vol*Math.sqrt(i),l68:base-last*vol*Math.sqrt(i),u95:base+last*vol*Math.sqrt(i)*1.96,l95:base-last*vol*Math.sqrt(i)*1.96});}return pts;}
